name: paper-trading

on:
  schedule:
    - cron: "0 */4 * * *"   # cada 4 horas (UTC)
  workflow_dispatch:         # permite correrlo a mano

permissions:
  contents: write

concurrency:
  group: paper
  cancel-in-progress: true

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Paper futures (B-Kalman 4h)
        run: python -m src.paper
      - name: Paper spot (tendencia 1d)
        run: python -m src.paper_spot
      - name: Paper carry (funding)
        run: python -m src.paper_carry
      - name: Generar dashboard
        run: python -m src.dashboard
      - name: Guardar logs y dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/paper_log_futures.csv experiments/paper_log_spot.csv experiments/paper_log_carry.csv docs/index.html
          git commit -m "paper trading: actualiza billeteras y dashboard" || echo "sin cambios"
          git push
